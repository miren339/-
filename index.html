<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A6321F">
<title>名刺帳</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-seal" aria-hidden="true"></span>
    <h1>名刺帳</h1>
  </div>
  <p class="brand-sub">撮って、探す。自分専用の名刺整理</p>
</header>

<div class="search-wrap">
  <input id="searchInput" type="search" placeholder="名前・会社・部署・電話番号で検索" autocomplete="off">
  <span class="search-count" id="searchCount"></span>
</div>

<main id="cardList" class="card-list" aria-live="polite">
  <!-- 名刺カードがここに描画されます -->
</main>

<div id="emptyState" class="empty-state" hidden>
  <div class="empty-seal" aria-hidden="true"></div>
  <p>まだ名刺がありません</p>
  <p class="empty-sub">右下のスタンプを押して、最初の1枚を撮影しましょう</p>
</div>

<!-- カメラ起動用 -->
<input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>

<button id="captureBtn" class="stamp-btn" aria-label="名刺を撮影する">
  <span class="stamp-btn-inner">撮影</span>
</button>

<!-- 読み取り中オーバーレイ -->
<div id="scanningOverlay" class="overlay" hidden>
  <div class="overlay-card">
    <div class="scan-seal spinning" aria-hidden="true"></div>
    <p id="scanningLabel">読み取り中…</p>
    <p class="overlay-sub">初回はOCRデータのダウンロードに少し時間がかかります</p>
  </div>
</div>

<!-- 詳細・編集シート -->
<div id="detailSheet" class="sheet" hidden>
  <div class="sheet-inner">
    <button class="sheet-close" id="sheetClose" aria-label="閉じる">×</button>
    <img id="detailImage" class="detail-image" alt="名刺画像">

    <form id="detailForm" class="detail-form">
      <label>氏名
        <input type="text" id="fieldName" placeholder="山田 太郎">
      </label>
      <label>会社名
        <input type="text" id="fieldCompany" placeholder="株式会社〇〇">
      </label>
      <label>部署・役職
        <input type="text" id="fieldTitle" placeholder="営業部 部長">
      </label>
      <label>電話番号
        <input type="tel" id="fieldPhone" placeholder="03-1234-5678">
      </label>
      <label>メールアドレス
        <input type="email" id="fieldEmail" placeholder="taro@example.com">
      </label>
      <label>住所
        <input type="text" id="fieldAddress" placeholder="東京都〇〇区…">
      </label>
      <label>メモ
        <textarea id="fieldNote" rows="2" placeholder="出会った場所・案件など"></textarea>
      </label>
      <details class="raw-text-details">
        <summary>読み取った全文を見る</summary>
        <p id="fieldRaw" class="raw-text"></p>
      </details>

      <div class="sheet-actions">
        <button type="button" id="deleteBtn" class="btn btn-ghost-danger">削除</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 設定・バックアップメニュー -->
<button id="menuBtn" class="menu-btn" aria-label="メニュー">⋯</button>
<div id="menuSheet" class="sheet sheet-small" hidden>
  <div class="sheet-inner">
    <button class="sheet-close" id="menuClose" aria-label="閉じる">×</button>
    <h2>バックアップ</h2>
    <p class="menu-desc">データは端末内にのみ保存されています。機種変更やブラウザデータ消去に備えて、書き出しをおすすめします。</p>
    <div class="menu-actions">
      <button id="exportBtn" class="btn btn-outline">JSONで書き出す</button>
      <label class="btn btn-outline file-label">
        JSONから読み込む
        <input type="file" id="importInput" accept="application/json" hidden>
      </label>
    </div>
    <p class="menu-count" id="menuCount"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="app.js"></script>
</body>
</html>
